<!-- Millis Dynamics robot-arm mark, drawn as SVG so it stays crisp at any size.
     To use the original artwork file instead, save it as assets/img/logo.png and
     change the <img src="assets/img/logo.svg"> references in the page headers. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Millis Dynamics">
  <defs>
    <linearGradient id="mdUpper" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#150a0c"/>
      <stop offset="0.5" stop-color="#5c0f19"/>
      <stop offset="1" stop-color="#a81c2b"/>
    </linearGradient>
    <linearGradient id="mdFore" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#100809"/>
      <stop offset="0.65" stop-color="#280910"/>
      <stop offset="1" stop-color="#4d0f18"/>
    </linearGradient>
    <linearGradient id="mdBase" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#93171f"/>
      <stop offset="1" stop-color="#6c0e18"/>
    </linearGradient>
  </defs>

  <!-- forearm -->
  <path d="M46 14h74v40H46z" fill="url(#mdFore)"/>

  <!-- gripper -->
  <g fill="#7c7c7c">
    <path d="M134 4h8v19h-6a6 6 0 0 0-6 6v11a6 6 0 0 0 6 6h6v19h-8a17 17 0 0 1-17-17V21a17 17 0 0 1 17-17z"/>
    <path d="M140 5l50 10a5 5 0 0 1-1 10l-49-2z"/>
    <path d="M140 65l50-10a5 5 0 0 0-1-10l-49 2z"/>
  </g>

  <!-- upper arm: stroked so the shoulder gets a true round cap -->
  <path d="M24 36 96 126" stroke="url(#mdUpper)" stroke-width="45" stroke-linecap="round" fill="none"/>

  <!-- base: rounded shoulder, then a stepped foot out to the right -->
  <path d="M15 198c0-42 8-75 32-96 13-11 34-8 42 8l14 28h13c8 0 15 5 19 12l22 48z" fill="url(#mdBase)"/>

  <!-- joints -->
  <circle cx="24" cy="36" r="13" fill="#fff"/>
  <circle cx="24" cy="36" r="8" fill="#7c7c7c"/>
  <circle cx="92" cy="120" r="22" fill="#fff"/>
  <circle cx="92" cy="120" r="14.5" fill="#7c7c7c"/>
</svg>
